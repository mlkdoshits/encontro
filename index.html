<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bora marcar um date?</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #e54b33;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .card {
            background-color: #2b1d1a;
            width: 90%;
            max-width: 380px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .image-container {
            width: 100%;
            max-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .image-container img {
            max-width: 110px;
            max-height: 120px;
            height: auto;
            object-fit: contain;
        }

        h2 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        p {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-top: 5px;
            position: relative;
        }

        .btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            flex: 1;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }

        .btn-nao {
            background: linear-gradient(135deg, #444, #222);
            box-shadow: none !important;
            flex: 1;
            position: relative;
            transition: none !important;
        }

        .btn-nao:hover {
            transform: none !important;
            box-shadow: none !important;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
        }

        .option-card {
            background-color: #3d2b27;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 10px 4px;
            font-size: 11px;
            font-weight: 600;
            color: #ddd;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .option-card span {
            font-size: 20px;
        }

        .option-card.selected {
            border-color: #ff416c;
            background-color: #523832;
            color: #fff;
        }

        .input-box {
            width: 100%;
            background: #3d2b27;
            border: none;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        .summary-box {
            background: #3d2b27;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            text-align: left;
            font-size: 13px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card" id="app-card">
        <!-- TELA 1: Bora marcar um date? (Agora é a primeira tela) -->
        <div id="screen-1" class="screen">
            <div class="image-container">
                <img src="img/rosas.png" alt="Bora marcar um date">
            </div>
            <h2>Bora marcar um date?</h2>
            <div class="btn-group" id="btn-group-container">
                <button class="btn" onclick="nextScreen(2)">Sim</button>
                <button class="btn btn-nao" id="btn-nao" onmouseenter="teletransportar(event)" ontouchstart="teletransportar(event)">Não</button>
            </div>
        </div>

        <!-- TELA 2 -->
        <div id="screen-2" class="screen hidden">
            <div class="image-container">
                <img src="img/vitoria.png" alt="Ta bom entao gostosa">
            </div>
            <button class="btn" onclick="nextScreen(3)" style="width: 100%;">Próximo 💙</button>
        </div>

        <!-- TELA 3 -->
        <div id="screen-3" class="screen hidden">
            <div class="image-container">
                <img src="img/cafe.png" alt="Café e curvas">
            </div>
            <input type="date" id="data-date" class="input-box">
            <input type="time" id="hora-date" class="input-box">
            <button class="btn" onclick="nextScreen(4)" style="width: 100%;">Selecionar a data 🚀</button>
        </div>

        <!-- TELA 4: Opções de comida -->
        <div id="screen-4" class="screen hidden">
            <div class="options-grid" id="food-grid" style="margin-top: 5px;">
                <div class="option-card" onclick="selectOption('food', 'Hambúrguer', this)"><span>🍔</span>Hambúrguer</div>
                <div class="option-card" onclick="selectOption('food', 'Sushi', this)"><span>🍱</span>Sushi</div>
                <div class="option-card" onclick="selectOption('food', 'Massa', this)"><span>🍝</span>Massa</div>
                <div class="option-card" onclick="selectOption('food', 'Pizza', this)"><span>🍕</span>Pizza</div>
                <div class="option-card" onclick="selectOption('food', 'Piquenique', this)"><span>🧺</span>Piquenique</div>
                <div class="option-card" onclick="selectOption('food', 'Me Surpreenda', this)"><span>🎁</span>Me surpreenda</div>
            </div>
            <button class="btn" onclick="validateFood()" style="width: 100%; margin-top: 5px;">Escolher prato 🍽️</button>
        </div>

        <!-- TELA 5: Resumo e Memes Aleatórios -->
        <div id="screen-5" class="screen hidden">
            <div class="image-container" id="final-img-container">
                <img id="final-meme-img" src="img/meme1.png" alt="Meme final">
            </div>
            <div class="summary-box">
                <div>📅 <span id="res-data"></span></div>
                <div>⏰ <span id="res-hora"></span></div>
                <div>🍽️ <span id="res-food">Pizza</span></div>
            </div>
            <button class="btn" onclick="enviarWhatsApp()" style="background: linear-gradient(135deg, #25d366, #128c7e); width: 100%;">Mandar Resposta no WhatsApp 📱</button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            const horas = String(hoje.getHours()).padStart(2, '0');
            const minutos = String(hoje.getMinutes()).padStart(2, '0');

            document.getElementById('data-date').value = `${ano}-${mes}-${dia}`;
            document.getElementById('hora-date').value = `${horas}:${minutos}`;
        });

        let selectedData = {
            date: '',
            time: '',
            food: ''
        };

        function nextScreen(screenNumber) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            
            const targetId = `screen-${screenNumber}`;
            document.getElementById(targetId).classList.remove('hidden');

            if (screenNumber === 5) {
                const rawDate = document.getElementById('data-date').value;
                if (rawDate) {
                    const parts = rawDate.split('-');
                    selectedData.date = `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
                selectedData.time = document.getElementById('hora-date').value;

                document.getElementById('res-data').innerText = selectedData.date;
                document.getElementById('res-hora').innerText = selectedData.time;
                document.getElementById('res-food').innerText = selectedData.food || 'Não selecionado';

                const memesFinais = [
                    "img/meme1.png", 
                    "img/meme2.png", 
                    "img/meme3.png", 
                    "img/meme4.png"  
                ];
                const escolhido = memesFinais[Math.floor(Math.random() * memesFinais.length)];
                document.getElementById('final-meme-img').src = escolhido;
            }
        }

        let currentX = 0;
        let currentY = 0;

        function teletransportar(e) {
            if (e.type === 'touchstart') {
                e.preventDefault();
            }

            const btnNao = document.getElementById('btn-nao');
            const isMobile = window.innerWidth <= 768 || e.type === 'touchstart';

            const limitX = isMobile ? 90 : 160;
            const limitY = isMobile ? 80 : 130;

            const randomX = (Math.random() * 2 - 1) * limitX;
            const randomY = (Math.random() * 2 - 1) * limitY;

            currentX = randomX;
            currentY = randomY;

            btnNao.style.transform = `translate(${currentX}px, ${currentY}px)`;
        }

        function selectOption(category, value, element) {
            const parent = element.parentElement;
            parent.querySelectorAll('.option-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            selectedData[category] = value;
        }

        function validateFood() {
            if (!selectedData.food) {
                alert('Selecione uma opção de comida!');
                return;
            }
            nextScreen(5);
        }

        function enviarWhatsApp() {
            const texto = `Opa! Aceito o convite para o date! 🎉\n📅 Data: ${selectedData.date}\n⏰ Horário: ${selectedData.time}\n🍽️ Prato: ${selectedData.food}`;
            const url = `https://api.whatsapp.com/send?phone=555193308915&text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
