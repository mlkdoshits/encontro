<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um convite especial para você ❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #ff4757;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .calendar-section {
            margin-top: 20px;
            background: #fff5f5;
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #ff4757;
        }
        input[type="date"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            width: 80%;
            margin-top: 10px;
            outline: none;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #ff6b81;
            transform: scale(1.02);
        }
        #mensagem-sucesso {
            margin-top: 15px;
            color: #2ed573;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Aceita sair comigo? ☕</h1>
        <p>Pensei com carinho em um lugar legal pra gente conversar, rir e passar um tempo juntos. Que tal?</p>
        
        <div class="calendar-section">
            <label for="data-encontro"><strong>Escolha o melhor dia para você:</strong></label><br>
            <input type="date" id="data-encontro">
            <br>
            <button onclick="enviarResposta()">Confirmar Data 💖</button>
        </div>

        <p id="mensagem-sucesso">Oba! Data salva. Agora me manda print ou me avisa no WhatsApp! 🥰</p>
    </div>

    <script>
        function enviarResposta() {
            const dataInput = document.getElementById('data-encontro').value;
            const mensagem = document.getElementById('mensagem-sucesso');
            
            if (!dataInput) {
                alert('Por favor, selecione uma data no calendário primeiro! 😉');
                return;
            }

            // Formata a data de AAAA-MM-DD para DD/MM/AAAA
            const partes = dataInput.split('-');
            const dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;

            // Exibe a mensagem de sucesso na tela
            mensagem.style.display = 'block';
            mensagem.innerHTML = `Perfeito! Dia ${dataFormatada} confirmado! 🥳<br>Tira um print dessa tela e me manda no WhatsApp!`;
        }
    </script>

</body>
</html>
