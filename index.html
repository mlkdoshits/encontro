<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aceita sair comigo? ❤️</title>

    <!-- METATAGS PARA PRÉVIA DO LINK (WHATSAPP / REDES SOCIAIS) -->
    <meta property="og:title" content="Aceita sair comigo? ☕">
    <meta property="og:description" content="Pensei com carinho em um lugar legal pra gente conversar. Escolha a data!">
    <meta property="og:image" content="https://seu-link-do-render.onrender.com/casal.png">
    <meta property="og:url" content="https://seu-link-do-render.onrender.com/">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Aceita sair comigo? ☕">
    <meta name="twitter:description" content="Pensei com carinho em um lugar legal pra gente conversar. Escolha a data!">
    <meta name="twitter:image" content="https://seu-link-do-render.onrender.com/casal.png">

    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 40px 20px; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); 
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 480px;
            width: 100%;
            position: relative;
        }
        
        .meme-img {
            max-width: 100%;
            height: auto;
            max-height: 200px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            object-fit: cover;
        }

        h1 { 
            font-size: 2rem; 
            color: #ff4757; 
            margin-bottom: 20px;
        }
        
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
            height: 120px; 
            position: relative;
        }
        
        button { 
            font-size: 1.3rem; 
            padding: 12px 30px; 
            cursor: pointer; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        
        .sim { background: #28a745; }
        
        .nao { 
            background: #dc3545; 
            position: absolute;
            right: 20px; 
            top: 20px;
            touch-action: none;
        }
        
        #status { 
            font-size: 1.1rem; 
            color: #222; 
            font-weight: bold;
            min-height: 40px;
            padding: 10px;
            border-radius: 12px;
            background: transparent;
            margin-bottom: 15px;
            transition: all 0.2s ease;
        }

        .sugestao-container {
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 10px;
        }
        
        p { color: #666; font-size: 1rem; margin-bottom: 12px; }
        
        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        input[type="date"] {
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-weight: bold;
            outline: none;
            color: #444;
        }
        
        .btn-data { 
            background: #ff6b81; 
            font-size: 1rem; 
            padding: 10px 18px; 
        }
    </style>
</head>
<body>

    <div class="card" id="site-card">
        <!-- Substitua pelo link de uma imagem bonitinha ou meme se quiser -->
        <img src="casal.png" alt="Convite Especial" class="meme-img" id="imagem-topo">
        
        <h1>Quer sair comigo? ☕</h1>
        
        <div class="btn-container" id="area-botoes">
            <div style="position: absolute; left: 20px; top: 20px;">
                <button class="sim" id="btn-sim-clique">Sim! 🥰</button>
            </div>
            <button class="nao" id="btn-nao">Não 🙄</button>
        </div>

        <div id="status"></div>

        <div class="sugestao-container">
            <p>Se aceitar, escolha o melhor dia para o nosso encontro:</p>
            <div class="input-group">
                <input type="date" id="data-input">
                <button class="btn-data" id="btn-data-clique">Confirmar 💖</button>
            </div>
        </div>
    </div>

    <script>
        const btnSim = document.getElementById('btn-sim-clique');
        const btnNao = document.getElementById('btn-nao');
        const btnData = document.getElementById('btn-data-clique');
        const areaBotoes = document.getElementById('area-botoes');
        const dataInput = document.getElementById('data-input');
        const statusDiv = document.getElementById('status');

        function fugirDoAmigo(evento) {
            if(evento) evento.preventDefault();
            const larguraContainer = areaBotoes.offsetWidth - btnNao.offsetWidth;
            const alturaContainer = areaBotoes.offsetHeight - btnNao.offsetHeight;
            
            let novoX = Math.random() * larguraContainer;
            let novoY = Math.random() * alturaContainer;
            
            if (novoX < 140) {
                novoX = 140 + (Math.random() * (larguraContainer - 140));
            }
            
            if (novoY > 40) {
                novoY = Math.random() * 40;
            }
            
            btnNao.style.right = 'auto';
            btnNao.style.left = novoX + 'px';
            btnNao.style.top = novoY + 'px';
        }

        btnNao.addEventListener('mouseover', fugirDoAmigo);
        btnNao.addEventListener('pointerdown', fugirDoAmigo);
        btnNao.addEventListener('touchstart', fugirDoAmigo);

        btnSim.addEventListener('click', () => {
            statusDiv.innerHTML = "🎉 Ebaaa! Sabia que diria sim! Escolha a data abaixo e me avise! 🥰✨";
            statusDiv.style.color = "#155724";
            statusDiv.style.backgroundColor = "#d4edda";
            statusDiv.style.border = "1px solid #c3e6cb";
            resgatarBotaoNao();
        });

        btnNao.addEventListener('click', (e) => {
            e.preventDefault();
            fugirDoAmigo(e);
            statusDiv.innerHTML = "⚠️ O botão de não está quebrado! Tente clicar em Sim! 🏃‍♂️💨";
            statusDiv.style.color = "#856404";
            statusDiv.style.backgroundColor = "#fff3cd";
            statusDiv.style.border = "1px solid #ffeeba";
        });

        btnData.addEventListener('click', () => {
            const dataValor = dataInput.value;
            
            if(dataValor) {
                const partes = dataValor.split('-');
                const dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;

                statusDiv.innerHTML = `📅 Encontro marcado para o dia ${dataFormatada}! Tira print e me manda! 🥂💖`;
                statusDiv.style.color = "#155724";
                statusDiv.style.backgroundColor = "#d4edda";
                statusDiv.style.border = "1px solid #c3e6cb";
            } else {
                statusDiv.innerHTML = "⚠️ Por favor, selecione uma data no calendário primeiro!";
                statusDiv.style.color = "#721c24";
                statusDiv.style.backgroundColor = "#f8d7da";
                statusDiv.style.border = "1px solid #f5c6cb";
            }
        });

        function resgatarBotaoNao() {
            btnNao.style.left = 'auto';
            btnNao.style.top = '20px';
            btnNao.style.right = '20px';
        }
    </script>
</body>
</html>
