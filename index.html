<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bora marcar um date?</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #e54b33;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background-color: #2b1d1a;
            width: 90%;
            max-width: 380px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .image-container {
            width: 100%;
            max-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .image-container img {
            max-width: 120px;
            height: auto;
            object-fit: contain;
        }

        h2 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            flex: 1;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }

        .btn-nao {
            background: linear-gradient(135deg, #444, #222);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
        }

        .option-card {
            background-color: #3d2b27;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 10px 4px;
            font-size: 11px;
            font-weight: 600;
            color: #ddd;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .option-card span {
            font-size: 20px;
        }

        .option-card.selected {
            border-color: #ff416c;
            background-color: #523832;
            color: #fff;
        }

        .input-box {
            width: 100%;
            background: #3d2b27;
            border: none;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        .summary-box {
            background: #3d2b27;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            text-align: left;
            font-size: 13px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card" id="app-card">
        <!-- TELA 1 -->
        <div id="screen-1" class="screen">
            <div class="image-container">
                <img src="https://i.imgur.com/813uO4t.png" alt="Emoji com rosa">
            </div>
            <h2>Bora marcar um date?</h2>
            <div class="btn-group">
                <button class="btn" onclick="nextScreen(2)">Sim</button>
                <button class="btn btn-nao" id="btn-nao" onmouseover="fugir()" onclick="fugir()">Não</button>
            </div>
        </div>

        <!-- TELA 2 -->
        <div id="screen-2" class="screen hidden">
            <div class="image-container">
                <img src="https://i.imgur.com/k9b6N4m.png" alt="Emoji Vitoria">
            </div>
            <h2>ta bom entao gostosa</h2>
            <button class="btn" onclick="nextScreen(3)" style="margin-top: 15px; width: 100%;">Próximo 💙</button>
        </div>

        <!-- TELA 3 -->
        <div id="screen-3" class="screen hidden">
            <div class="image-container">
                <img src="https://i.imgur.com/r6w5q2s.png" alt="Emoji Café">
            </div>
            <h2 style="font-size: 13px; line-height: 1.4;">Você cheia de curvas e eu aqui sem freio... me diz aí: quando vai ser o nosso acidente?</h2>
            <input type="date" id="data-date" class="input-box" value="2025-06-21">
            <input type="time" id="hora-date" class="input-box" value="19:00">
            <button class="btn" onclick="nextScreen(4)" style="width: 100%;">Selecionar a data 🚀</button>
        </div>

        <!-- TELA 4: Opções de comida atualizadas (com Piquenique e Me surpreenda) -->
        <div id="screen-4" class="screen hidden">
            <div class="options-grid" id="food-grid" style="grid-template-columns: repeat(2, 1fr); margin-top: 10px;">
                <div class="option-card" onclick="selectOption('food', 'Hambúrguer', this)"><span>🍔</span>Hambúrguer</div>
                <div class="option-card" onclick="selectOption('food', 'Sushi', this)"><span>🍱</span>Sushi</div>
                <div class="option-card" onclick="selectOption('food', 'Massa', this)"><span>🍝</span>Massa</div>
                <div class="option-card" onclick="selectOption('food', 'Pizza', this)"><span>🍕</span>Pizza</div>
                <div class="option-card" onclick="selectOption('food', 'Piquenique', this)"><span>🧺</span>Piquenique</div>
                <div class="option-card" onclick="selectOption('food', 'Me Surpreenda', this)"><span>🎁</span>Me surpreenda</div>
            </div>
            <button class="btn" onclick="validateFood()" style="width: 100%; margin-top: 10px;">Escolher prato 🍽️</button>
        </div>

        <!-- TELA 5: Vibe -->
        <div id="screen-5" class="screen hidden">
            <div class="options-grid" id="vibe-grid" style="grid-template-columns: repeat(2, 1fr); margin-top: 10px;">
                <div class="option-card" onclick="selectOption('vibe', 'Pub/Bar', this)"><span>🍻</span>Pub/Bar</div>
                <div class="option-card" onclick="selectOption('vibe', 'Candlelight', this)"><span>🕯️</span>Candlelight</div>
                <div class="option-card" onclick="selectOption('vibe', 'Cinema', this)"><span>🍿</span>Cinema</div>
                <div class="option-card" onclick="selectOption('vibe', 'Caseiro', this)"><span>🏠</span>Caseiro</div>
                <div class="option-card" onclick="selectOption('vibe', 'Parque', this)"><span>🌳</span>Parque</div>
                <div class="option-card" onclick="selectOption('vibe', 'Praia', this)"><span>🌊</span>Praia</div>
            </div>
            <button class="btn" onclick="validateVibe()" style="width: 100%; margin-top: 10px;">Uma vibe legal 🌟</button>
        </div>

        <!-- TELA 6: Resumo e Mensagens Meme Aleatórias -->
        <div id="screen-6" class="screen hidden">
            <div class="image-container" id="final-img-container">
                <img id="final-meme-img" src="https://i.imgur.com/7gK5Y0m.png" alt="Meme final">
            </div>
            <div class="summary-box">
                <div>📅 <span id="res-data">21/06/2025</span></div>
                <div>⏰ <span id="res-hora">19:00</span></div>
                <div>🍽️ <span id="res-food">Pizza</span></div>
                <div>✨ <span id="res-vibe">Caseiro</span></div>
            </div>
            <button class="btn" onclick="enviarWhatsApp()" style="background: linear-gradient(135deg, #25d366, #128c7e); width: 100%;">Mandar Resposta no WhatsApp 📱</button>
        </div>
    </div>

    <script>
        let selectedData = {
            date: '21/06/2025',
            time: '19:00',
            food: '',
            vibe: ''
        };

        function nextScreen(screenNumber) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(`screen-${screenNumber}`).classList.remove('hidden');

            if (screenNumber === 6) {
                const rawDate = document.getElementById('data-date').value;
                if (rawDate) {
                    const parts = rawDate.split('-');
                    selectedData.date = `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
                selectedData.time = document.getElementById('hora-date').value;

                document.getElementById('res-data').innerText = selectedData.date;
                document.getElementById('res-hora').innerText = selectedData.time;
                document.getElementById('res-food').innerText = selectedData.food || 'Não selecionado';
                document.getElementById('res-vibe').innerText = selectedData.vibe || 'Não selecionado';

                // Lista de memes aleatórios para a última página conforme o relatório
                const memesFinais = [
                    "https://i.imgur.com/7gK5Y0m.png", // Beijinho / Falta isso aqui
                    "https://i.imgur.com/3Z8q2xL.png", // Pinguim matemática
                    "https://i.imgur.com/9w2Q1vR.png", // Tô contigo gatinha
                    "https://i.imgur.com/5f8V1kP.png"  // Aôô coisa boa
                ];
                const escolhido = memesFinais[Math.floor(Math.random() * memesFinais.length)];
                document.getElementById('final-meme-img').src = escolhido;
            }
        }

        function fugir() {
            const btnNao = document.getElementById('btn-nao');
            const x = Math.random() * 160 - 80;
            const y = Math.random() * 160 - 80;
            btnNao.style.transform = `translate(${x}px, ${y}px)`;
        }

        function selectOption(category, value, element) {
            const parent = element.parentElement;
            parent.querySelectorAll('.option-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            selectedData[category] = value;
        }

        function validateFood() {
            if (!selectedData.food) {
                alert('Selecione uma opção de comida!');
                return;
            }
            nextScreen(5);
        }

        function validateVibe() {
            if (!selectedData.vibe) {
                alert('Selecione a vibe do rolê!');
                return;
            }
            nextScreen(6);
        }

        function enviarWhatsApp() {
            const texto = `Opa! Aceito o convite para o date! 🎉\n📅 Data: ${selectedData.date}\n⏰ Horário: ${selectedData.time}\n🍽️ Prato: ${selectedData.food}\n✨ Vibe: ${selectedData.vibe}`;
            const url = `https://api.whatsapp.com/send?phone=&text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
